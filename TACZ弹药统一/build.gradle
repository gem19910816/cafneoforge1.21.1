plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = 'tacz-unidict-neoforge-1.21.1' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
neoForge {
    version = neoforge_version
    runs {
        client {
            client()
            if (providers.gradleProperty('verifyPort').isPresent()) {
                systemProperty 'tacz_unidict.verify', 'true'
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '720'
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (providers.gradleProperty('verifyPort').isPresent()) {
                systemProperty 'tacz_unidict.verify', 'true'
            }
        }
    }
    if (!providers.gradleProperty('verifyJar').isPresent()) {
        mods { tacz_unidict { sourceSet sourceSets.main } }
    }
}
repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}
dependencies {
    compileOnly files(tacz_jar)
    runtimeOnly files(tacz_jar)
    if (providers.gradleProperty('compatSmoke').isPresent()) {
        runtimeOnly fileTree(file(tacz_jar).parentFile) {
            include 'tacz-tweaks-3.0.0-alpha.10+1.21.1-neoforge.jar'
            include 'kotlinforforge-5.12.0-all.jar'
            include 'yet_another_config_lib_v3-3.8.2+1.21.1-neoforge.jar'
        }
    }
}
tasks.named('processResources', ProcessResources).configure {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                    mod_license: mod_license, mod_authors: mod_authors,
                    mod_description: mod_description]
    inputs.properties(metadata)
    exclude 'META-INF/mods.toml'
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand metadata }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest { attributes('MixinConfigs': 'tud.mixins.json', 'Implementation-Version': mod_version) }
    from(['LICENSE', 'CREDITS.txt', 'PORTING.md']) { into 'META-INF' }
}
tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    from(['LICENSE', 'CREDITS.txt', 'PORTING.md'])
}
if (providers.gradleProperty('verifyJar').isPresent()) {
    tasks.withType(JavaExec).configureEach {
        doFirst {
            classpath = classpath.minus(sourceSets.main.output)
            copy {
                from providers.gradleProperty('verifyJar').get()
                into 'run/mods'
            }
        }
    }
}

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.1.3'
group = 'net.mcreator.doomsdaydecoration'
base {
    archivesName = 'doomsday_decoration'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.255'

    mods {
        doomsday_decoration {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : '1.21.1',
            minecraft_version_range: '[1.21.1,1.21.2)',
            neoforge_version       : '21.1.255',
            neoforge_version_range : '[21.1,21.2)',
            loader_version_range   : '[4,)',
            mod_id                 : 'doomsday_decoration',
            mod_name               : 'Doomsday Decoration',
            mod_license            : 'All Rights Reserved',
            mod_version            : version,
            mod_authors            : 'Administrator, MCreator',
            mod_description        : 'Doomsday decoration blocks (末日装饰), ported to 1.21.1 NeoForge.',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

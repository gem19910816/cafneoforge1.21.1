# ===========================================================================
# CAF草药 —— NeoForge 1.21.1 工程
#   源工程：mod制作\1.20.1forge\药草作物（Forge 1.20.1）
#   工具链：ModDevGradle 2.0.107 + NeoForge 21.1.227
#   规范：开发者制作\文件夹结构规范以及部分规定指南.md
#   注意：工程文件夹名是 CAF草药，但 mod_id 仍是 crop_expansion ——
#         mod_id 与 assets/ data/ 路径必须纯小写 ASCII，不跟工程名走。
# ===========================================================================

# --- Gradle 自身 ---
# 不要在这里写 org.gradle.jvmargs：本机指定它会去 fork 单次 daemon 而启动失败。
# 需要内存时用环境变量 GRADLE_OPTS 传。
org.gradle.daemon=false

# ⚠ 规范 4.2 禁止本机绝对路径，所以这里【不写】org.gradle.java.installations.paths。
#    Java 版本改由 build.gradle 的 java.toolchain 声明（Java 21），
#    Gradle 自动从 JAVA_HOME / 系统中查找 JDK 21。

# --- Minecraft / NeoForge ---
minecraft_version=1.21.1
neo_version=21.1.227
# 下面三项会被注入 neoforge.mods.toml
minecraft_version_range=[1.21.1,1.21.2)
neo_version_range=21.1.0
loader_version_range=4

# --- 模组信息 ---
mod_id=crop_expansion
# 工程英文名（= 中文工程名「CAF草药」的英文翻译，规范 3.1.3），用于 jar 的 archivesName
mod_name_en=CAF_Herbs
mod_name=CAF Herbs (Crop Expansion)
# jar 名的中文前缀 [CAF草药]。这里用 \uXXXX 转义，是为了**不把中文写进 build.gradle** ——
# Gradle 脚本按平台默认编码读取，中文在非简体中文环境下会被误解码。
# 下面这行的实际值就是 [CAF草药]。
mod_archive_prefix=[CAF\u8349\u836F]
# ⚠ 这里必须用 \uXXXX 转义，不能直接写中文：
#    gradle.properties 由 Java Properties 按 ISO-8859-1 读取，
#    直接写「齿轮与腐肉作物扩展」会变成乱码 displayName="é½¿è½®ä¸èèä½ç©æ©å±"。
#    下面这行的实际值就是「齿轮与腐肉作物扩展」。
mod_display_name=\u9F7F\u8F6E\u4E0E\u8150\u8089\u4F5C\u7269\u6269\u5C55
# 主.次；修订位由 build_number.properties 提供，每次构建成功后 +1（规范 5.1）
mod_version=1.0
mod_group=cn.blockforge.generated.cropexpansion
# 许可与署名统一，与工程内 LICENSE 文件一致（MIT / © 2026 YuSheng-hina）
mod_license=MIT
mod_authors=YuSheng-hina

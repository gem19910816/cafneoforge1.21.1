# ===========================================================================
# CAF草药 —— NeoForge 1.21.1 移植版
#   源工程：mod制作\1.20.1forge\药草作物（Forge 1.20.1）
#   注意：工程文件夹叫 CAF草药，但 mod_id 仍是 crop_expansion ——
#         mod_id / 资源路径必须是纯小写 ASCII，不跟着文件夹名改。
#   工具链：ModDevGradle 2.0.107 + NeoForge 21.1.227
#   21.1.227 是 mod制作\通用\gradle-home 本地缓存里已有的版本，可离线构建
# ===========================================================================

# --- Gradle 自身 ---
# 不要在这里写 org.gradle.jvmargs：本机指定它会去 fork 单次 daemon 而启动失败。
# 需要内存时用环境变量 GRADLE_OPTS 传（见 build.ps1）。
org.gradle.daemon=false
# 本机 JDK 21 不在标准位置，明确告诉 Gradle 去哪找（properties 里可以用正斜杠）
org.gradle.java.installations.paths=E:/Minecraft/jave/jdk-21_windows-x64_bin/jdk-21.0.3

# --- Minecraft / NeoForge ---
minecraft_version=1.21.1
neo_version=21.1.227
# 下面三项会被注入 neoforge.mods.toml
minecraft_version_range=[1.21.1,1.21.2)
neo_version_range=21.1.0
loader_version_range=4

# --- 模组信息 ---
mod_id=crop_expansion
mod_name=Create And Flesh_Crop Expansion
# ⚠ 这里必须用 \uXXXX 转义，不能直接写中文：
#    gradle.properties 由 Java Properties 按 ISO-8859-1 读取，
#    直接写「齿轮与腐肉作物扩展」会变成乱码 displayName="é½¿è½®ä¸èèä½ç©æ©å±"。
#    下面这行的实际值就是「齿轮与腐肉作物扩展」。
mod_display_name=\u9F7F\u8F6E\u4E0E\u8150\u8089\u4F5C\u7269\u6269\u5C55
mod_version=1.0.0
mod_group=cn.blockforge.generated.cropexpansion
mod_authors=AutoMods

# 本机路径配置 —— 换电脑 / 换实例时只需要改这个文件
# （build.ps1 刻意保持纯 ASCII，中文路径全部集中在这里）

# 共用 Gradle 发行版与依赖缓存：全盘唯一一份，见 文件夹结构规范.md
gradle_bin=E:/Minecraft/开发者制作/mod制作/通用/gradle-8.8/bin/gradle.bat
gradle_user_home=E:/Minecraft/开发者制作/mod制作/通用/gradle-home

# JDK 21（NeoForge 1.21.1 要求 Java 21）
java_home=E:/Minecraft/jave/jdk-21_windows-x64_bin/jdk-21.0.3

# 构建完成后自动把 jar 复制到这里（留空则不复制）
# 规范：mod保存/{游戏版本及加载器名字}/{mod中文名}/
deploy_dir=E:/Minecraft/开发者制作/mod保存/1.21.1neoforge/CAF草药

# 构建完成后自动部署到这个测试实例的 mods 目录（留空则不部署）
# 该实例：NeoForge 21.1.255 / Minecraft 1.21.1
deploy_mods=E:/Minecraft/PCL2/.minecraft/versions/移植mod测试/mods

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

dependencies {
    // TaCZ 仅用于编译，运行期由玩家/整合包提供，绝不打包进本模组的 jar
    compileOnly files(tacz_jar)
    // 原生 Sponge Mixin；刻意不引入 MixinExtras，少一个依赖少一份风险
    compileOnly "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"

    // 开发期联调用：让 runClient / runServer 能真的加载 TaCZ 来核对 mixin 注入点。
    // 只作用于 run* 任务，不会进入发布产物，也不构成对 TaCZ 的再分发。
    runtimeOnly files(tacz_jar)
}

// 缺少编译用 TaCZ jar 时，只在真正编译时报错，并给出可操作的提示。
// 配置阶段不抛异常，这样 `gradlew tasks` 之类的命令仍然可用。
tasks.named('compileJava').configure {
    doFirst {
        if (!rootProject.file(tacz_jar).exists()) {
            throw new GradleException("""
                |[Ammo Unify] 找不到编译用的 TaCZ jar：${tacz_jar}
                |
                |它只用于编译，不会被打进发布产物。请到 Modrinth 下载 TaCZ 的
                |1.21.1 NeoForge 版本（项目 slug: tacz-1.21.1，1.1.8-hotfix 系列），
                |放到项目的 libs/ 目录下，文件名与 gradle.properties 里的 tacz_jar 一致。
                |""".stripMargin())
        }
    }
}

// 把 gradle.properties 里的元数据注入 neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_license      : mod_license,
            mod_description  : mod_description,
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json",
        ])
    }
    // AGPL-3.0 要求分发时随附许可与来源说明，这里打进 jar 的 META-INF 下
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE-ammo_unify' }
        into 'META-INF'
    }
    from(rootProject.file('NOTICE.md')) {
        rename { 'NOTICE-ammo_unify.md' }
        into 'META-INF'
    }
}

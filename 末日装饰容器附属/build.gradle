plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.carrion.doomsdaycontainers'
base {
    archivesName = 'doomsdaycontainers'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.255'

    mods {
        doomsdaycontainers {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // 想在开发环境里连着原模组一起启动：把末日装饰的 jar 放进 libs/ 再取消下面这行注释
    // runtimeOnly files('libs/doomsday_decoration-1.1.3-neoforge-1.21.1.jar')
    //
    // 编译本身不需要原模组：混入目标是以字符串形式写的类名，运行时才解析，
    // 所以这个附属可以独立编译、独立发版。
}

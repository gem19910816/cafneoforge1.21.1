# CAF 生存核心（原 tarkov_stamina_mod）—— 1.21.1 NeoForge
#
# 构建环境固定为「离线可用」的那一套：Gradle 8.8 + 通用\gradle-home 缓存 +
# JDK 21 + ModDevGradle 2.0.107 + NeoForge 21.1.227。
# 这台机器没有外网，所以版本号不能随手往上抬 —— 抬了缓存里没有，构建直接红。
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=true

## 环境（编译用）
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
# 运行时接受的 NeoForge 下限。21.1.x 是稳定分支，故编译版可高于下限。
neo_version_range=[21.1.0,)
# NeoForge 21.1 的 FML 是 4.x
loader_version_range=[4,)

## 模组身份
# mod_id 保持 tarkov_stamina 不变：现有存档里的持久化数据挂在 player persistentData
# 的 "tarkov_stamina" 键下，改名等于把老存档的体力进度清零。
mod_id=tarkov_stamina
mod_name=CAF 生存核心
mod_license=All Rights Reserved
mod_version=1.0.0-port
mod_group_id=com.chaosz.tarkovstamina
mod_authors=ChaosZ Pack
mod_description=A server-authoritative stamina system with a polished tactical HUD.\nIncludes sprint drain, jump cost, recovery delay, exhaustion lockout, persistence, and smooth client animation.

## 依赖
# Curios 9.x（1.21.1）。jar 随附在 libs\ 里，走 flatDir —— 无外网时 maven 取不到。
curios_version=9.5.1+1.21.1
